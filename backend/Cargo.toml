[package]
name = "music-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"
mime_guess = "2.0"
sanitize-filename = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Optimize tokio: only enable features we actually need
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono", "macros"] }
thiserror = "1.0"
futures-util = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1"
url = "2.5"
lofty = "0.12"
once_cell = "1.20"
strsim = "0.10"
deunicode = "1.1"
sha2 = "0.10"
hex = "0.4"
subtle = "2.4"
regex = "1.12.2"
num_cpus = "1.16"

[profile.release]
# Optimize for size and reduce memory usage in release builds
opt-level = "z"       # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Better optimization (slower compile)
panic = "abort"       # Smaller binary, less overhead
strip = true          # Strip symbols from binary

