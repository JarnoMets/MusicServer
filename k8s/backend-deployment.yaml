apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-pvc
  namespace: music
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: music
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: jarn/music-server-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        - name: RUST_LOG
          # Default to WARN to reduce log volume in cluster; override at deploy time if you need more verbosity
          value: "warn,sqlx=warn,sqlx::query=warn"
        - name: RUST_BACKTRACE
          value: "1"
        - name: DATABASE_URL
          value: postgres://postgresuser:your-password-here@postgres.postgres:5432/musicdb
          # RUN_MIGRATIONS: When set to "false" or "0" the backend will not run programmatic
          # migrations at startup. Use this when your database is managed and migrations must be
          # applied via an external process or administrative user.
          # - name: RUN_MIGRATIONS
          #   value: "false"
        - name: ADMIN_TOKEN_SHA256
          valueFrom:
            secretKeyRef:
              name: music-admin
              key: ADMIN_TOKEN_SHA256
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: music-admin
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: music-admin
              key: GOOGLE_CLIENT_SECRET
        - name: APP_URL
          valueFrom:
            secretKeyRef:
              name: music-admin
              key: APP_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: music-admin
              key: JWT_SECRET
        - name: DISCOGS_TOKEN
          valueFrom:
            secretKeyRef:
              name: music-admin
              key: DISCOGS_TOKEN
        - name: MUSIC_FOLDER
          value: /music
        volumeMounts:
        - name: music-storage
          mountPath: /music
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "8Gi"
            cpu: "1000m"
        # Health checks - readiness only, no forced restarts
        startupProbe:
          httpGet:
            path: /api/health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: music-storage
        persistentVolumeClaim:
          claimName: music-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: music
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
  type: ClusterIP
