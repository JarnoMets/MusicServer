server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Increase max body size for file uploads (500MB)
    client_max_body_size 500M;
    
    # Increase timeouts for large uploads and slow operations
    client_body_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    keepalive_timeout 600s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8081;
        # Use HTTP/1.1 and avoid forcing an 'upgrade' Connection header.
        # For SSE we must not let the proxy buffer the response, otherwise
        # events will be held until the buffer fills and the connection may
        # appear to be closed to the browser. Disable buffering and keep
        # transfer in chunked mode.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # Do not force 'upgrade' for SSE; allow keep-alive streaming.
        proxy_set_header Connection "";
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Large file upload support
        client_max_body_size 500M;
        proxy_request_buffering off;
        
        # Extended timeouts for slow operations
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
