version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=musicdb
      - POSTGRES_USER=postgresuser
      - POSTGRES_PASSWORD=postgrespwd
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresuser -d musicdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      # Default to WARN to reduce log volume; override with RUST_LOG env when needed
      - RUST_LOG=warn,sqlx=warn,sqlx::query=warn
      - DATABASE_URL=postgres://postgresuser:postgrespwd@postgres:5432/musicdb
      - GOOGLE_CLIENT_ID=584501599293-v853k7gg70sl3cec009o1qqk290415kb.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - JWT_SECRET=8e8c8d8f8a8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d
      - APP_URL=https://music.jarnomets.com
      - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
